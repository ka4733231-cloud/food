<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NutriBite AI — Intelligent Culinary &amp; Nutrition Platform</title>
  <meta name="description" content="NutriBite AI: Combining MOB recipe discovery and Calz AI food scanning, verified USDA nutrition tracking, and smart meal planning.">

  <!-- Google Fonts: Playfair Display (Serif) & Plus Jakarta Sans (Sans-serif) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- NutriBite AI Master Design System Stylesheet -->
  <link rel="stylesheet" href="css/nutribite.css">

  <style>
    /* ============================================
       SIDEBAR INLINE OVERRIDES & COMPONENT STYLES
       ============================================ */

    /* ---- Mobile hamburger button (hidden on desktop) ---- */
    #mobile-menu-toggle {
      display: none;
      align-items: center;
      justify-content: center;
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: var(--bg-subtle);
      border: 1px solid var(--border-color);
      color: var(--text-charcoal);
      font-size: 1.1rem;
      cursor: pointer;
      transition: all 0.2s;
      flex-shrink: 0;
    }
    #mobile-menu-toggle:hover {
      background: var(--secondary-light);
      color: var(--primary);
    }

    /* ---- Header search (input style override) ---- */
    .header-search {
      border: none;
    }

    /* ---- Header user pill ---- */
    .user-profile-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid var(--border-color);
      background: var(--bg-card);
      cursor: pointer;
      transition: all 0.22s;
    }
    .user-profile-pill:hover {
      border-color: var(--secondary);
      background: var(--secondary-light);
    }

    /* ============================================
       SIDEBAR BRAND SECTION (top of sidebar)
       ============================================ */
    .sidebar-brand-row {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 0 14px;
      height: 64px;           /* exactly matches header height */
      min-height: 64px;
      border-bottom: 1px solid var(--border-color);
      cursor: pointer;
      flex-shrink: 0;
      background: var(--bg-card);
      position: sticky;
      top: 0;
      z-index: 10;
      transition: background 0.2s;
    }
    .sidebar-brand-row:hover {
      background: var(--bg-subtle);
    }
    .sidebar-brand-logo {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
      color: #fff;
      display: grid;
      place-items: center;
      box-shadow: 0 4px 12px rgba(35, 75, 53, 0.28);
      flex-shrink: 0;
    }
    .sidebar-brand-logo svg {
      width: 20px;
      height: 20px;
    }
    .sidebar-brand-text {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }
    .sidebar-brand-name {
      font-size: 1.02rem;
      font-weight: 800;
      color: var(--primary);
      letter-spacing: -0.4px;
      line-height: 1.1;
      white-space: nowrap;
    }
    .sidebar-brand-name em {
      font-style: italic;
      font-weight: 400;
      color: var(--accent-orange);
    }
    .sidebar-brand-sub {
      font-size: 0.595rem;
      color: var(--text-light);
      text-transform: uppercase;
      letter-spacing: 0.9px;
      font-weight: 600;
      white-space: nowrap;
      margin-top: 1px;
    }

    /* ============================================
       SIDEBAR NAV HEADER SPACER
       (creates gap between sidebar brand & header)
       ============================================ */
    .sidebar-header-spacer {
      height: 64px; /* matches app-header height */
      flex-shrink: 0;
      display: none; /* only needed if sidebar is full-height */
    }

    /* ============================================
       SIDEBAR NAV SCROLLABLE AREA
       ============================================ */
    .sidebar-nav-scrollable {
      flex: 1;
      overflow-y: auto;
      padding: 4px 8px 10px;
      scrollbar-width: thin;
      scrollbar-color: var(--border-color) transparent;
    }
    .sidebar-nav-scrollable::-webkit-scrollbar { width: 3px; }
    .sidebar-nav-scrollable::-webkit-scrollbar-thumb {
      background: var(--border-color);
      border-radius: 3px;
    }

    /* ============================================
       SIDEBAR ICON SYSTEM (SVG-based, no emoji)
       ============================================ */
    .nav-icon svg {
      width: 17px;
      height: 17px;
      stroke-width: 2;
      flex-shrink: 0;
    }
    .nav-item.active .nav-icon svg {
      stroke: #fff;
    }
    .nav-item:not(.active) .nav-icon svg {
      stroke: currentColor;
    }

    /* ============================================
       SIDEBAR SECTION TITLES — improved spacing
       ============================================ */
    .sidebar-section-title {
      display: block;
      font-size: 0.645rem;
      font-weight: 800;
      color: var(--text-light);
      text-transform: uppercase;
      letter-spacing: 1.1px;
      padding: 16px 8px 5px;
      margin: 0;
    }
    .sidebar-section-title:first-child {
      padding-top: 10px;
    }

    /* ============================================
       SIDEBAR STATUS BOTTOM CARD
       ============================================ */
    .sidebar-db-card {
      margin: 0 8px 12px;
      padding: 10px 12px;
      background: linear-gradient(135deg, #f1ede4 0%, #ede9e0 100%);
      border-radius: 11px;
      font-size: 0.73rem;
      border: 1px solid var(--border-color);
      flex-shrink: 0;
    }
    body.dark-mode .sidebar-db-card {
      background: linear-gradient(135deg, var(--bg-subtle) 0%, #1e2b24 100%);
    }
    .sidebar-db-card-title {
      color: var(--primary);
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 5px;
      margin-bottom: 3px;
      font-size: 0.74rem;
    }
    .sidebar-db-card-body {
      color: var(--text-muted);
      line-height: 1.4;
      font-size: 0.705rem;
    }

    /* ---- Backend status indicator dot ---- */
    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #22c55e;
      display: inline-block;
      flex-shrink: 0;
      animation: pulse-dot 2.4s ease-in-out infinite;
    }
    @keyframes pulse-dot {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.38; }
    }

    /* ============================================
       ADMIN NAV ITEM — subtle distinction
       ============================================ */
    .nav-item.admin-nav {
      border: 1px dashed color-mix(in srgb, var(--border-color) 100%, transparent);
      color: var(--text-muted);
    }
    .nav-item.admin-nav:hover {
      border-color: var(--accent-orange);
      background: rgba(242, 166, 90, 0.08) !important;
      color: #b8691e;
    }
    .nav-item.admin-nav .nav-icon svg {
      stroke: var(--accent-orange);
    }

    /* ============================================
       ACTIVE NAV INDICATOR — left accent bar
       ============================================ */
    .nav-item.active {
      position: relative;
    }
    .nav-item.active::before {
      content: '';
      position: absolute;
      left: -8px;
      top: 50%;
      transform: translateY(-50%);
      width: 3px;
      height: 60%;
      background: var(--accent-orange);
      border-radius: 0 3px 3px 0;
    }

    /* ============================================
       HOVER & FOCUS STATES FOR NAV
       ============================================ */
    .nav-item:focus-visible {
      outline: 2px solid var(--primary);
      outline-offset: 2px;
    }

    /* ============================================
       SIDEBAR DIVIDER
       ============================================ */
    .sidebar-divider {
      height: 1px;
      background: var(--border-color);
      margin: 6px 8px;
      opacity: 0.6;
    }
  </style>
</head>
<body>

  <!-- Mobile Sidebar Overlay Backdrop -->
  <div class="sidebar-overlay" id="sidebar-overlay" onclick="NutriBiteApp.closeSidebar()"></div>

  <!-- NutriBite Application Shell -->
  <div class="nutribite-app">

    <!-- =====================================================
         TOP HEADER — fixed, starts after sidebar on desktop
         ===================================================== -->
    <header class="app-header">

      <!-- Mobile Hamburger Toggle -->
      <button id="mobile-menu-toggle" onclick="NutriBiteApp.toggleSidebar()" aria-label="Open navigation menu">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
        </svg>
      </button>

      <!-- Global Search -->
      <div style="flex: 1; max-width: 460px; margin: 0 16px;" class="hide-mobile">
        <input type="text" class="header-search" placeholder="🔍  Search recipes, ingredients, or foods..."
               onkeydown="if(event.key==='Enter'){ NutriBiteRouter.navigate('recipes'); }">
      </div>

      <!-- Spacer on mobile to center title -->
      <div style="font-size: 1rem; font-weight: 800; color: var(--primary);" class="show-mobile-only" onclick="NutriBiteRouter.navigate('dashboard')">NutriBite <em style="font-style:italic;font-weight:400;color:var(--accent-orange);">AI</em></div>

      <!-- Header Controls -->
      <div class="header-actions">
        <!-- Voice Assistant -->
        <button id="voice-command-btn" class="btn btn-secondary btn-sm hide-mobile"
                onclick="NutriBiteApp.toggleVoiceCommand()"
                title="Voice commands: 'scan meal', 'open recipes', 'log water'">
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 1 3 3v7a3 3 0 0 1-6 0V5a3 3 0 0 1 3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="22"/></svg>
          Voice
        </button>

        <!-- Dark Mode Toggle -->
        <button class="btn-icon" onclick="document.body.classList.toggle('dark-mode')" title="Toggle Dark / Warm Mode">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>

        <!-- Subscription Plan Badge -->
        <div id="header-subscription-badge" onclick="NutriBiteRouter.navigate('pricing')"
             style="cursor: pointer;" title="Manage Membership">
          <span class="plan-pill free">FREE</span>
        </div>

        <!-- User Profile Pill -->
        <div class="user-profile-pill" onclick="NutriBiteRouter.navigate('profile')">
          <div class="user-avatar-badge">👨‍🍳</div>
          <div class="hide-mobile">
            <span style="display: block; font-size: 0.82rem; font-weight: 700; color: var(--text-charcoal);" id="header-user-name">Alex Morgan</span>
            <span style="display: block; font-size: 0.68rem; color: var(--primary); font-weight: 600;">2,100 kcal target</span>
          </div>
        </div>
      </div>
    </header>

    <!-- =====================================================
         APP BODY — sidebar + main viewport
         ===================================================== -->
    <div class="app-body">

      <!-- =====================================================
           SIDEBAR — fixed full-height, independent scroll
           ===================================================== -->
      <aside class="app-sidebar" id="app-sidebar">

        <!-- Brand Row — sticky at top of sidebar -->
        <div class="sidebar-brand-row" onclick="NutriBiteRouter.navigate('landing'); NutriBiteApp.closeSidebar();">
          <div class="sidebar-brand-logo">
            <!-- Leaf / plant icon -->
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10z"/><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/>
            </svg>
          </div>
          <div class="sidebar-brand-text">
            <span class="sidebar-brand-name">NutriBite <em>AI</em></span>
            <span class="sidebar-brand-sub">Food Intelligence Platform</span>
          </div>
        </div>

        <!-- Scrollable Nav Body -->
        <div class="sidebar-nav-scrollable">

          <!-- SECTION: Main -->
          <span class="sidebar-section-title">Main</span>
          <ul class="sidebar-nav">
            <li>
              <button class="nav-item active" data-nav="dashboard" onclick="NutriBiteRouter.navigate('dashboard'); NutriBiteApp.closeSidebar();">
                <span class="nav-icon">
                  <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
                </span>
                <span class="nav-label">Dashboard</span>
              </button>
            </li>
            <li>
              <button class="nav-item" data-nav="scanner" onclick="NutriBiteRouter.navigate('scanner'); NutriBiteApp.closeSidebar();">
                <span class="nav-icon">
                  <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
                </span>
                <span class="nav-label">AI Food Scanner</span>
              </button>
            </li>
            <li>
              <button class="nav-item" data-nav="recipes" onclick="NutriBiteRouter.navigate('recipes'); NutriBiteApp.closeSidebar();">
                <span class="nav-icon">
                  <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
                </span>
                <span class="nav-label">Recipe Discovery</span>
              </button>
            </li>
            <li>
              <button class="nav-item" data-nav="planner" onclick="NutriBiteRouter.navigate('planner'); NutriBiteApp.closeSidebar();">
                <span class="nav-icon">
                  <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                </span>
                <span class="nav-label">Meal Planner</span>
              </button>
            </li>
            <li>
              <button class="nav-item" data-nav="groceries" onclick="NutriBiteRouter.navigate('groceries'); NutriBiteApp.closeSidebar();">
                <span class="nav-icon">
                  <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
                </span>
                <span class="nav-label">Smart Grocery List</span>
              </button>
            </li>
          </ul>

          <!-- SECTION: Nutrition & Tracking -->
          <span class="sidebar-section-title">Nutrition &amp; Tracking</span>
          <ul class="sidebar-nav">
            <li>
              <button class="nav-item" data-nav="diary" onclick="NutriBiteRouter.navigate('diary'); NutriBiteApp.closeSidebar();">
                <span class="nav-icon">
                  <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
                </span>
                <span class="nav-label">Daily Food Diary</span>
              </button>
            </li>
            <li>
              <button class="nav-item" data-nav="analytics" onclick="NutriBiteRouter.navigate('analytics'); NutriBiteApp.closeSidebar();">
                <span class="nav-icon">
                  <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
                </span>
                <span class="nav-label">Nutrition Analytics</span>
              </button>
            </li>
            <li>
              <button class="nav-item" data-nav="assistant" onclick="NutriBiteRouter.navigate('assistant'); NutriBiteApp.closeSidebar();">
                <span class="nav-icon">
                  <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                </span>
                <span class="nav-label">Chef Nova AI</span>
              </button>
            </li>
          </ul>

          <!-- SECTION: Membership & Plans -->
          <span class="sidebar-section-title">Membership &amp; Plans</span>
          <ul class="sidebar-nav">
            <li>
              <button class="nav-item" data-nav="pricing" onclick="NutriBiteRouter.navigate('pricing'); NutriBiteApp.closeSidebar();">
                <span class="nav-icon">
                  <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
                </span>
                <span class="nav-label">Pricing &amp; Plans</span>
              </button>
            </li>
            <li>
              <button class="nav-item" data-nav="subscription" onclick="NutriBiteRouter.navigate('subscription'); NutriBiteApp.closeSidebar();">
                <span class="nav-icon">
                  <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>
                </span>
                <span class="nav-label">Subscription &amp; Quota</span>
              </button>
            </li>
            <li>
              <button class="nav-item" data-nav="billing-history" onclick="NutriBiteRouter.navigate('billing-history'); NutriBiteApp.closeSidebar();">
                <span class="nav-icon">
                  <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
                </span>
                <span class="nav-label">Billing History</span>
              </button>
            </li>
          </ul>

          <!-- SECTION: Account -->
          <span class="sidebar-section-title">Account</span>
          <ul class="sidebar-nav">
            <li>
              <button class="nav-item" data-nav="profile" onclick="NutriBiteRouter.navigate('profile'); NutriBiteApp.closeSidebar();">
                <span class="nav-icon">
                  <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                </span>
                <span class="nav-label">Profile &amp; Goals</span>
              </button>
            </li>
            <li>
              <button class="nav-item" data-nav="onboarding" onclick="NutriBiteRouter.navigate('onboarding'); NutriBiteApp.closeSidebar();">
                <span class="nav-icon">
                  <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 8 12 12 14 14"/></svg>
                </span>
                <span class="nav-label">Personalize Plan</span>
              </button>
            </li>
            <li>
              <button class="nav-item" data-nav="settings" onclick="NutriBiteRouter.navigate('settings'); NutriBiteApp.closeSidebar();">
                <span class="nav-icon">

  <!-- Sidebar mobile drawer logic -->
  <script>
    // Extend NutriBiteApp with sidebar controls (safe — won't override existing methods)
    document.addEventListener('DOMContentLoaded', function() {
      if (window.NutriBiteApp) {
        if (!NutriBiteApp.toggleSidebar) {
          NutriBiteApp.toggleSidebar = function() {
            const sidebar = document.getElementById('app-sidebar');
            const overlay = document.getElementById('sidebar-overlay');
            if (!sidebar) return;
            const isOpen = sidebar.classList.toggle('sidebar-open');
            if (overlay) overlay.classList.toggle('active', isOpen);
          };
        }
        if (!NutriBiteApp.closeSidebar) {
          NutriBiteApp.closeSidebar = function() {
            const sidebar = document.getElementById('app-sidebar');
            const overlay = document.getElementById('sidebar-overlay');
            if (sidebar) sidebar.classList.remove('sidebar-open');
            if (overlay) overlay.classList.remove('active');
          };
        }
      } else {
        // Fallback if app.js defines NutriBiteApp later
        window._sidebarToggle = function() {
          const sidebar = document.getElementById('app-sidebar');
          const overlay = document.getElementById('sidebar-overlay');
          if (!sidebar) return;
          const isOpen = sidebar.classList.toggle('sidebar-open');
          if (overlay) overlay.classList.toggle('active', isOpen);
        };
        window._sidebarClose = function() {
          const sidebar = document.getElementById('app-sidebar');
          const overlay = document.getElementById('sidebar-overlay');
          if (sidebar) sidebar.classList.remove('sidebar-open');
          if (overlay) overlay.classList.remove('active');
        };
        // Repoint onclick handlers
        const toggleBtn = document.getElementById('mobile-menu-toggle');
        if (toggleBtn) toggleBtn.onclick = window._sidebarToggle;
        const overlayEl = document.getElementById('sidebar-overlay');
        if (overlayEl) overlayEl.onclick = window._sidebarClose;
      }

      // Close sidebar on Escape key
      document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') {
          if (window.NutriBiteApp && NutriBiteApp.closeSidebar) NutriBiteApp.closeSidebar();
          else if (window._sidebarClose) window._sidebarClose();
        }
      });
    });
  </script>
